<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport optimizado para bloquear zoom del navegador en móviles y usar todo el display -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galaxia 3D Interactiva</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none; /* Bloquea gestos del navegador (pull-to-refresh) para control fluido */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Soporte para Dynamic Viewport Height en móviles */
      overflow: hidden;
      background-color: #030008;
    }

    canvas.webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      outline: none;
      display: block;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <canvas class="webgl"></canvas>
  <script src="galaxia.js"></script>
</body>
</html>
